name: Build ZUNIQ APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Android platform and brand PNGs
        run: bash scripts/setup_android.sh
      - run: flutter pub get
      - name: Launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=ZUNIQ_API_URL=${{ secrets.ZUNIQ_API_URL }} --dart-define=ZUNIQ_API_KEY=${{ secrets.ZUNIQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: zuniq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
